<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Studio — Studio Avancé</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col font-sans antialiased">

    <!-- En-tête -->
    <header class="bg-indigo-900 text-white shadow-md py-4 px-6 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-700 p-2.5 rounded-xl shadow-inner">
                <i class="fa-solid fa-wand-magic-sparkles text-xl text-indigo-200"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Notification Studio — Édition Avancée</h1>
                <p class="text-xs text-indigo-300">Modèles, variables, options interactives & designs</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div id="sync-badge" class="flex items-center space-x-2 bg-emerald-950/60 border border-emerald-500/30 text-emerald-300 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Cloud Synchro</span>
            </div>
            <button onclick="openNewModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-sm transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Nouveau modèle</span>
            </button>
        </div>
    </header>

    <!-- Corps principal -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Barre latérale -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shadow-sm">
            <div class="p-4 border-b border-slate-100 space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="search-input" oninput="filterTemplates()" placeholder="Rechercher un modèle..." class="w-full pl-9 pr-4 py-2 bg-slate-100 border-none rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 text-slate-700">
                </div>
                <div class="flex rounded-lg bg-slate-100 p-1 text-xs font-medium text-slate-600">
                    <button onclick="setLangFilter('ALL')" id="filter-all" class="flex-1 py-1 bg-white rounded-md shadow-xs text-indigo-600 font-semibold transition">Tous</button>
                    <button onclick="setLangFilter('FR')" id="filter-fr" class="flex-1 py-1 rounded-md transition">🇫🇷 FR</button>
                    <button onclick="setLangFilter('EN')" id="filter-en" class="flex-1 py-1 rounded-md transition">🇬🇧 EN</button>
                </div>
            </div>
            
            <div id="templates-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2 space-y-1">
                <!-- Rempli dynamiquement -->
            </div>
        </aside>

        <!-- Zone centrale -->
        <main class="flex-1 flex flex-col bg-slate-100 overflow-y-auto p-6">
            <div id="main-content" class="max-w-4xl w-full mx-auto space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center text-slate-500">
                    <i class="fa-regular fa-folder-open text-4xl text-indigo-300 mb-3"></i>
                    <h2 class="text-lg font-semibold text-slate-700">Sélectionnez un modèle dans la liste</h2>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal d'édition complet -->
    <div id="template-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="modal-title" class="font-bold text-slate-800 text-lg">Éditer le modèle</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="edit-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Nom du modèle</label>
                        <input type="text" id="edit-name" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Langue & Design</label>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="edit-lang" class="w-full px-2 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                <option value="FR">🇫🇷 FR</option>
                                <option value="EN">🇬🇧 EN</option>
                            </select>
                            <select id="edit-design" class="w-full px-2 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                <option value="corporate">Classique</option>
                                <option value="modern">Moderne</option>
                                <option value="minimal">Minimal</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Objet du courriel</label>
                    <input type="text" id="edit-subject" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Corps du message (Variables [Nom] & Options [?Option])</label>
                        <button onclick="insertTemplateSnippet()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium"><i class="fa-solid fa-wand-magic text-[10px]"></i> Insérer un bloc d'options</button>
                    </div>
                    <textarea id="edit-body" rows="8" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-100">Annuler</button>
                <button onclick="saveTemplate()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-500 shadow-sm">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Scripts Firebase & Application Avancée -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, setDoc, doc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC6EyK5xUX6wU0FqOqxbd7uwTlryZ4wAR4",
            authDomain: "email-notification-6c89c.firebaseapp.com",
            projectId: "email-notification-6c89c",
            storageBucket: "email-notification-6c89c.firebasestorage.app",
            messagingSenderId: "587710435543",
            appId: "1:587710435543:web:bd8e6904ddceea43b9e092"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const COLLECTION_NAME = "artifacts_templates";

        const defaultTemplates = [
            {
                id: "adv-fr",
                name: "Notification de mission",
                lang: "FR",
                design: "modern",
                subject: "Validation de mission : [Mission] pour [Collaborateur]",
                body: "Bonjour [Collaborateur],\n\nVotre mission [Mission] est confirmée pour la date du [Date].\n\nVeuillez valider les éléments suivants :\n[?Confirmer la présence sur site]\n[?Télécharger le badge d'accès]\n[?Demander un ordre de mission]\n\nBien cordialement,\n[Manager]"
            },
            {
                id: "adv-en",
                name: "Mission Notification",
                lang: "EN",
                design: "corporate",
                subject: "Mission Approval: [Mission] for [Collaborateur]",
                body: "Hello [Collaborateur],\n\nYour mission [Mission] is confirmed for [Date].\n\nPlease check the required options:\n[?Confirm on-site attendance]\n[?Download access badge]\n[?Request travel authorization]\n\nBest regards,\n[Manager]"
            }
        ];

        let templates = [...defaultTemplates];
        let currentSelectedId = null;
        let currentFilterLang = 'ALL';

        function initBackend() {
            try {
                const colRef = collection(db, COLLECTION_NAME);
                onSnapshot(colRef, (snapshot) => {
                    if (!snapshot.empty) {
                        const cloudTemplates = [];
                        snapshot.forEach(docSnap => cloudTemplates.push(docSnap.data()));
                        templates = cloudTemplates;
                    } else {
                        defaultTemplates.forEach(t => saveToCloud(t));
                    }
                    renderTemplatesList();
                    if (!currentSelectedId && templates.length > 0) selectTemplate(templates[0].id);
                    else if (currentSelectedId) selectTemplate(currentSelectedId);
                }, (error) => { loadLocal(); });
            } catch (e) { loadLocal(); }
        }

        async function saveToCloud(tpl) {
            try { await setDoc(doc(db, COLLECTION_NAME, tpl.id), tpl); } catch (e) {}
        }

        function loadLocal() {
            const saved = localStorage.getItem('notification_templates_adv');
            if (saved) { try { templates = JSON.parse(saved); } catch(e) {} }
            renderTemplatesList();
            if (!currentSelectedId && templates.length > 0) selectTemplate(templates[0].id);
        }

        function persistTemplates() {
            localStorage.setItem('notification_templates_adv', JSON.stringify(templates));
            renderTemplatesList();
        }

        window.setLangFilter = function(lang) {
            currentFilterLang = lang;
            ['ALL', 'FR', 'EN'].forEach(l => {
                const btn = document.getElementById(`filter-${l.toLowerCase()}`);
                if (btn) {
                    btn.className = l === lang ? "flex-1 py-1 bg-white rounded-md shadow-xs text-indigo-600 font-semibold transition" : "flex-1 py-1 rounded-md transition text-slate-600";
                }
            });
            renderTemplatesList();
        }

        window.filterTemplates = function() { renderTemplatesList(); }

        function renderTemplatesList() {
            const listEl = document.getElementById('templates-list');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const filtered = templates.filter(t => {
                const matchLang = currentFilterLang === 'ALL' || t.lang === currentFilterLang;
                const matchSearch = t.name.toLowerCase().includes(searchVal) || t.subject.toLowerCase().includes(searchVal);
                return matchLang && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">Aucun modèle trouvé</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <div onclick="selectTemplate('${t.id}')" class="p-3 rounded-xl cursor-pointer transition flex items-center justify-between group ${currentSelectedId === t.id ? 'bg-indigo-50 border border-indigo-200' : 'hover:bg-slate-50 border border-transparent'}">
                    <div class="overflow-hidden pr-2">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${t.lang === 'EN' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}">${t.lang || 'FR'}</span>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono">${t.design || 'corporate'}</span>
                            <h4 class="text-sm font-semibold text-slate-800 truncate">${t.name}</h4>
                        </div>
                        <p class="text-xs text-slate-500 truncate mt-0.5">${t.subject}</p>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center space-x-1">
                        <button onclick="event.stopPropagation(); editTemplate('${t.id}')" class="p-1.5 text-slate-400 hover:text-indigo-600 rounded"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="event.stopPropagation(); deleteTemplate('${t.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded"><i class="fa-solid fa-trash text-xs"></i></button>
                    </div>
                </div>
            `).join('');
        }

        window.selectTemplate = function(id) {
            currentSelectedId = id;
            renderTemplatesList();
            const tpl = templates.find(t => t.id === id);
            if (!tpl) return;

            const varRegex = /\[([^\]]+)\]/g;
            const varsSet = new Set();
            let match;
            while ((match = varRegex.exec(tpl.subject + "\n" + tpl.body)) !== null) {
                if (!match[1].startsWith('?')) varsSet.add(match[1]);
            }

            const mainEl = document.getElementById('main-content');
            mainEl.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">
                    <div class="flex justify-between items-start border-b border-slate-100 pb-4">
                        <div>
                            <div class="flex items-center space-x-2 mb-1">
                                <span class="text-xs font-bold px-2 py-0.5 rounded ${tpl.lang === 'EN' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'}">${tpl.lang || 'FR'}</span>
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">Design: ${tpl.design || 'corporate'}</span>
                            </div>
                            <h2 class="text-xl font-bold text-slate-800">${tpl.name}</h2>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="editTemplate('${tpl.id}')" class="px-3 py-1.5 text-xs font-medium border border-slate-200 rounded-lg hover:bg-slate-50 text-slate-700 flex items-center space-x-1.5">
                                <i class="fa-solid fa-pen text-xs"></i><span>Modifier</span>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200/60">
                        <div class="space-y-3">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Variables dynamiques</h3>
                            <div class="space-y-2">
                                ${Array.from(varsSet).length === 0 ? '<p class="text-xs text-slate-400 italic">Aucune variable</p>' : ''}
                                ${Array.from(varsSet).map(v => `
                                    <div>
                                        <label class="block text-xs font-medium text-slate-600 mb-1">${v}</label>
                                        <input type="text" data-var="${v}" oninput="updatePreview()" placeholder="Valeur pour ${v}..." class="w-full px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 var-input">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="space-y-3">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Options à cocher interactives</h3>
                            <div id="options-checkboxes" class="space-y-2"></div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500">Aperçu du message</h3>
                            <div class="flex space-x-2">
                                <button onclick="copyPlain()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5">
                                    <i class="fa-regular fa-copy"></i><span>Copier Texte</span>
                                </button>
                                <button onclick="copyHtml()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5">
                                    <i class="fa-solid fa-code"></i><span>Copier HTML Stylisé</span>
                                </button>
                            </div>
                        </div>
                        <div id="preview-wrapper" class="border rounded-xl overflow-hidden bg-white shadow-xs transition-all">
                            <div id="preview-header-bar" class="px-4 py-2.5 border-b text-xs font-semibold flex items-center justify-between">
                                <span id="preview-subject-label">Objet : ...</span>
                            </div>
                            <div id="preview-body" class="p-6 text-sm whitespace-pre-wrap leading-relaxed min-h-[160px]"></div>
                        </div>
                    </div>
                </div>
            `;

            const optionRegex = /\[\?([^\]]+)\]/g;
            const optionsContainer = document.getElementById('options-checkboxes');
            let optMatch, optHtml = '', optIndex = 0;
            while ((optMatch = optionRegex.exec(tpl.body)) !== null) {
                const optText = optMatch[1];
                optHtml += `
                    <label class="flex items-center space-x-2 text-sm text-slate-700 cursor-pointer bg-white p-2 rounded-lg border border-slate-200/80 hover:border-slate-300">
                        <input type="checkbox" data-option="${optText}" onchange="updatePreview()" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4 opt-checkbox" checked>
                        <span class="text-xs">${optText}</span>
                    </label>
                `;
                optIndex++;
            }
            optionsContainer.innerHTML = optIndex === 0 ? `<p class="text-xs text-slate-400 italic">Aucune option [?] configurée</p>` : optHtml;
            updatePreview();
        }

        window.updatePreview = function() {
            const tpl = templates.find(t => t.id === currentSelectedId);
            if (!tpl) return;

            let subject = tpl.subject;
            let body = tpl.body;

            document.querySelectorAll('.var-input').forEach(input => {
                const varName = input.getAttribute('data-var');
                const val = input.value || `[${varName}]`;
                const regex = new RegExp(`\\[${varName}\\]`, 'g');
                subject = subject.replace(regex, val);
                body = body.replace(regex, val);
            });

            document.querySelectorAll('.opt-checkbox').forEach(chk => {
                const optText = chk.getAttribute('data-option');
                const regex = new RegExp(`\\[\\?${optText}\\]`, 'g');
                body = body.replace(regex, chk.checked ? `✔ ${optText}` : '');
            });

            document.getElementById('preview-subject-label').innerText = `Objet : ${subject}`;
            document.getElementById('preview-body').innerText = body;

            // Application des styles selon le design choisi
            const wrapper = document.getElementById('preview-wrapper');
            const headerBar = document.getElementById('preview-header-bar');
            if (tpl.design === 'modern') {
                wrapper.className = "border border-indigo-100 rounded-xl overflow-hidden bg-indigo-50/20 shadow-sm";
                headerBar.className = "bg-indigo-900 text-indigo-100 px-4 py-3 border-b border-indigo-100 text-xs font-semibold flex items-center justify-between";
            } else if (tpl.design === 'minimal') {
                wrapper.className = "border border-slate-200 rounded-lg overflow-hidden bg-white shadow-none";
                headerBar.className = "bg-slate-50 text-slate-600 px-4 py-2 border-b border-slate-100 text-xs font-semibold flex items-center justify-between";
            } else {
                wrapper.className = "border border-slate-200 rounded-xl overflow-hidden bg-white shadow-xs";
                headerBar.className = "bg-slate-100 text-slate-700 px-4 py-2.5 border-b border-slate-200 text-xs font-semibold flex items-center justify-between";
            }
        }

        window.openNewModal = function() {
            document.getElementById('modal-title').innerText = "Créer un nouveau modèle";
            document.getElementById('edit-id').value = 'tpl_' + Date.now();
            document.getElementById('edit-name').value = '';
            document.getElementById('edit-lang').value = 'FR';
            document.getElementById('edit-design').value = 'corporate';
            document.getElementById('edit-subject').value = '';
            document.getElementById('edit-body').value = '';
            document.getElementById('template-modal').classList.remove('hidden');
            document.getElementById('template-modal').classList.add('flex');
        }

        window.editTemplate = function(id) {
            const tpl = templates.find(t => t.id === id);
            if (!tpl) return;
            document.getElementById('modal-title').innerText = "Modifier le modèle";
            document.getElementById('edit-id').value = tpl.id;
            document.getElementById('edit-name').value = tpl.name;
            document.getElementById('edit-lang').value = tpl.lang || 'FR';
            document.getElementById('edit-design').value = tpl.design || 'corporate';
            document.getElementById('edit-subject').value = tpl.subject;
            document.getElementById('edit-body').value = tpl.body;
            document.getElementById('template-modal').classList.remove('hidden');
            document.getElementById('template-modal').classList.add('flex');
        }

        window.closeModal = function() {
            document.getElementById('template-modal').classList.remove('flex');
            document.getElementById('template-modal').classList.add('hidden');
        }

        window.insertTemplateSnippet = function() {
            const textarea = document.getElementById('edit-body');
            textarea.value += "\n\nOptions optionnelles :\n[?Option A inclure]\n[?Option B optionnelle]";
        }

        window.saveTemplate = function() {
            const id = document.getElementById('edit-id').value;
            const name = document.getElementById('edit-name').value.trim();
            const lang = document.getElementById('edit-lang').value;
            const design = document.getElementById('edit-design').value;
            const subject = document.getElementById('edit-subject').value.trim();
            const body = document.getElementById('edit-body').value.trim();

            if (!name || !subject || !body) { alert("Veuillez remplir tous les champs."); return; }

            const existingIndex = templates.findIndex(t => t.id === id);
            const newTpl = { id, name, lang, design, subject, body };

            if (existingIndex >= 0) templates[existingIndex] = newTpl;
            else templates.push(newTpl);

            saveToCloud(newTpl);
            persistTemplates();
            closeModal();
            selectTemplate(id);
        }

        window.deleteTemplate = function(id) {
            if (confirm("Supprimer ce modèle ?")) {
                templates = templates.filter(t => t.id !== id);
                try { deleteDoc(doc(db, COLLECTION_NAME, id)); } catch(e) {}
                persistTemplates();
                if (currentSelectedId === id) {
                    currentSelectedId = null;
                    document.getElementById('main-content').innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center text-slate-500"><h2 class="text-lg font-semibold text-slate-700">Sélectionnez un modèle</h2></div>`;
                }
            }
        }

        window.copyPlain = function() {
            const subject = document.getElementById('preview-subject-label').innerText.replace('Objet : ', '');
            const body = document.getElementById('preview-body').innerText;
            navigator.clipboard.writeText(`Objet : ${subject}\n\n${body}`);
            alert("Texte copié !");
        }

        window.copyHtml = function() {
            const subject = document.getElementById('preview-subject-label').innerText.replace('Objet : ', '');
            const body = document.getElementById('preview-body').innerHTML.replace(/\n/g, '<br>');
            navigator.clipboard.writeText(`<div><h3><b>${subject}</b></h3><br><p>${body}</p></div>`);
            alert("Code HTML stylisé copié !");
        }

        initBackend();
    </script>
</body>
</html>
